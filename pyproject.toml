[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocpp-garage"
version = "0.1.0"
description = "EV charging DLM and billing backend"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",         # PostgreSQL async driver
    "apscheduler>=3.10",     # interval sampling scheduler
    "ocpp>=2.0",             # OCPP 1.6J / 2.x (mobilityhouse) — for future OCPP adapter
    "typer>=0.12",           # CLI for admin commands
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
garage = "ocpp_garage.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ocpp_garage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
