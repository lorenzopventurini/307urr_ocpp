# Monthly EV charging statement — generate and email.
#
# THIS FILE BELONGS IN A SEPARATE PRIVATE REPOSITORY, at
#   .github/workflows/monthly-statement.yml
# not in the public code repository. It checks out the public code at run time,
# so the billing logic stays publicly auditable while run logs, statements and
# credentials stay private. (Scheduled workflows in a public repo would also be
# switched off by GitHub after 60 days without a commit.)
#
# Who receives the email:
#   Scheduled runs  production when the LIVE variable is "true", otherwise test.
#   Manual runs     whatever the "delivery" option says; test unless you pick
#                   production. Use these for outages and backlogs.
#   Test            only the STATEMENT_TEST_RECIPIENT address, marked [TEST].
#   Production      the tenant, copying the management company.
#
# Setup checklist: see "Automated monthly email" in the public repo's README.

name: Monthly EV charging statement

on:
  schedule:
    # 06:17 UTC on the 2nd: gives Easee a day to finalise the month's data,
    # and avoids the top of the hour, when GitHub's scheduler is busiest.
    - cron: "17 6 2 * *"
  workflow_dispatch:
    inputs:
      period:
        description: >-
          Month(s) to bill as YYYY-MM, e.g. 2026-09 or, for a backlog,
          2026-07, 2026-08, 2026-09 (all in ONE run). Blank = previous month.
        required: false
        default: ""
      delivery:
        description: "test = only the test address; production = tenant and management company"
        type: choice
        options:
          - test
          - production
        default: test

permissions:
  contents: read

# Never let two runs overlap. GitHub keeps only the newest WAITING run in a
# concurrency group and cancels older waiting ones, so bill a backlog as one
# run with several months rather than several runs started back to back.
concurrency:
  group: monthly-statement
  cancel-in-progress: false

jobs:
  statement:
    # Pinned rather than ubuntu-latest so the OS only changes when we choose to,
    # not silently between a tested run and a live billing run.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the public billing code
        uses: actions/checkout@v5
        with:
          repository: lorenzopventurini/307urr_ocpp
          # Pin to a tag or commit with the CODE_REF variable; defaults to main.
          ref: ${{ vars.CODE_REF || 'main' }}
          persist-credentials: false

      - name: Record which code version is billing
        run: echo "Billing code commit $(git rev-parse HEAD)"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install --quiet .

      - name: Write household configuration
        env:
          HOUSEHOLDS_TOML: ${{ secrets.HOUSEHOLDS_TOML }}
        run: |
          if [ -z "$HOUSEHOLDS_TOML" ]; then
            echo "::error::The HOUSEHOLDS_TOML secret is not set."
            exit 1
          fi
          printf '%s\n' "$HOUSEHOLDS_TOML" > households.toml

      - name: Generate and email statement(s)
        env:
          # Manual-run inputs go through env vars, never straight into the
          # script, so they cannot inject shell commands.
          PERIOD: ${{ inputs.period }}
          DELIVERY: ${{ github.event_name == 'schedule' && (vars.LIVE == 'true' && 'production' || 'test') || inputs.delivery }}
          TEST_RECIPIENT: ${{ vars.STATEMENT_TEST_RECIPIENT }}
          EASEE_USERNAME: ${{ secrets.EASEE_USERNAME }}
          EASEE_PASSWORD: ${{ secrets.EASEE_PASSWORD }}
          EASEE_CHARGER_SERIAL: ${{ secrets.EASEE_CHARGER_SERIAL }}
          TARIFF_FLAT_PRICE_PENCE: ${{ vars.TARIFF_FLAT_PRICE_PENCE }}
          TARIFF_INTERVAL_MINUTES: ${{ vars.TARIFF_INTERVAL_MINUTES }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          EMAIL_REPLY_TO: ${{ vars.EMAIL_REPLY_TO }}
        run: |
          set -f   # no glob expansion of the period list

          case "$DELIVERY" in
            production)
              # Empty = no redirect: the tenant and management company receive it.
              export STATEMENT_TEST_RECIPIENT=""
              echo "Delivery: PRODUCTION - tenant and management company"
              ;;
            test)
              # Never let a missing test address fall through to real recipients.
              if [ -z "$TEST_RECIPIENT" ]; then
                echo "::error::Test delivery needs the STATEMENT_TEST_RECIPIENT variable."
                exit 1
              fi
              export STATEMENT_TEST_RECIPIENT="$TEST_RECIPIENT"
              echo "Delivery: TEST - test address only"
              ;;
            *)
              echo "::error::Unknown delivery mode '$DELIVERY'."
              exit 1
              ;;
          esac

          if [ -z "$PERIOD" ]; then
            python scripts/generate_statement.py --previous-month --email
            exit $?
          fi

          # One or more months: commas and/or spaces, duplicates dropped,
          # oldest first. Carry on past a failed month, then fail the run.
          months=$(printf '%s' "$PERIOD" | tr ', ' '\n\n' | sed '/^$/d' | sort -u)

          # Check the whole list before sending anything: a typo should stop
          # the run cleanly, not after half a backlog has gone out.
          for month in $months; do
            case "$month" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]) ;;
              *) echo "::error::'$month' is not a month in YYYY-MM form. Nothing was sent."
                 exit 1 ;;
            esac
          done

          failed=""
          for month in $months; do
            echo "::group::Statement for $month"
            python scripts/generate_statement.py "$month" --email || failed="$failed $month"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Statements FAILED for:$failed (the others were sent)."
            exit 1
          fi

      # A private copy of every statement, kept even if the email step failed.
      - name: Keep a copy of the statement(s)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: statement-${{ github.run_id }}
          path: statements/*.pdf
          if-no-files-found: ignore
          retention-days: 90
